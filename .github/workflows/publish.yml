name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm Trusted Publishing requires npm >= 11.5.1 and Node >= 22.14.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build web UI
        run: bun run web:build

      - name: Validate package
        run: bun run release:validate

      # The first package version is created by an attended npm publish. Once
      # it exists, npm's trusted-publisher configuration authorizes this repo.
      - name: Confirm owned package exists
        run: npm view @aryasaatvik/motel version --registry=https://registry.npmjs.org/ > /dev/null

      - name: Publish (OIDC, no token)
        run: npm publish --provenance --access public

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --latest
