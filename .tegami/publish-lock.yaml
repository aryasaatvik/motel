core:changelogs:
  - content: "---\npackages:\n  \"@aryasaatvik/motel\":\n    type: patch\n---\n\n### Evict the oldest telemetry first when the database is over its size cap\n\nWhen the database exceeds `MOTEL_OTEL_MAX_DB_SIZE_MB`, Motel now removes traces and logs in age order. Before, every log became eligible at once, so fresh logs disappeared within milliseconds while older spans kept the database full.\n"
    filename: size-eviction-oldest-first.md
    v: 0.0.0
core:packages:
  - changelogIds:
      - size-eviction-oldest-first.md
    id: npm:@aryasaatvik/motel
    updated: true
